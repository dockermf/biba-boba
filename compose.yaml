# Stolen from: https://docs.docker.com/guides/postgresql/

services:
    database:
        image: postgres:18.6
        container_name: postgres
        deploy:
            resources:
                limits:
                    memory: 2G
        restart: always
        ports:
            - 5432:5432
        volumes:
            - ${PWD}/database:/var/lib/postgresql
            - ${PWD}/scripts/seed.sql:/docker-entrypoint-initdb.d/seed.sql
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: 1234
