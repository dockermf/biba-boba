# Stolen from: https://docs.docker.com/guides/postgresql/

services:
    backend:
        depends_on:
            - database
        build:
            context: .
            dockerfile: ./docker/backend/Dockerfile
        entrypoint: /entrypoint
        container_name: api-server
        hostname: api-server
        networks:
            - shared_net
        ports:
            - 8080:8080
        deploy:
            resources:
                limits:
                    memory: 2G
        restart: on-failure
        environment:
            PGUSER: $PGUSER
            PGPASSWORD: $PGPASSWORD
            PGHOST: "database" # == ip of running database container
            PGPORT: $PGPORT
            PGDATABASE: $PGDATABASE

    database:
        image: postgres:18.6
        container_name: postgres-server
        hostname: postgres-server
        networks:
            - shared_net
        ports:
            - $PGPORT:$PGPORT
        deploy:
            resources:
                limits:
                    memory: 2G
        restart: always
        volumes:
            - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
            - ./docker/postgres/database:/var/lib/postgresql
            - ./docker/postgres/scripts/seed.sql:/docker-entrypoint-initdb.d/seed.sql
        command: postgres -c config_file=/etc/postgresql/postgresql.conf
        environment:
            POSTGRES_USER: $PGUSER
            POSTGRES_PASSWORD: $PGPASSWORD

networks:
    shared_net:
        driver: bridge
