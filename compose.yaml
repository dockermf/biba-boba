# Stolen from: https://docs.docker.com/guides/postgresql/

services:
    database:
        image: postgres:18.6
        container_name: postgres
        deploy:
            resources:
                limits:
                    memory: 2G
        restart: always
        ports:
            - 5432:5432
        volumes:
            - ${PWD}/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
            - ${PWD}/postgres/database:/var/lib/postgresql
            - ${PWD}/postgres/scripts/seed.sql:/docker-entrypoint-initdb.d/seed.sql
        command: postgres -c config_file=/etc/postgresql/postgresql.conf
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: 1234
